name: CI

on:
  pull_request:
    paths-ignore: [ "docs/**" ]

  push:
    paths-ignore: [ "docs/**" ]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run tests
        env:
          COMPOSE_PROJECT_NAME: colocus_tests
        run: |
          docker compose --env-file envs/env.test -f docker-compose.tests.yml up \
            --force-recreate \
            --build \
            --abort-on-container-exit \
            --exit-code-from django

      - name: Tear down
        if: ${{ always() }}
        run: docker compose --env-file envs/env.test -f docker-compose.tests.yml down --volumes --remove-orphans
